<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>soq4_ | Discord Profile</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="profile-shell" aria-label="Discord style profile card">
    <section class="discord-card">
      <div class="banner" aria-hidden="true"></div>

      <div class="content">
        <div class="avatar-wrap">
          <img class="avatar" src="assets/profile-source.png" alt="Profile avatar" />
          <span class="status-dot" aria-label="Do not disturb status"></span>
        </div>

        <div class="name-row">
          <div class="identity">
            <h1 class="display-name">يارب وفق سالم بإختياره</h1>
            <div class="handle-row">
              <span>soq4_</span>
              <span class="verified" title="Verified">✓</span>
            </div>
          </div>
          <div class="more-button" aria-label="More options">···</div>
        </div>

        <div class="rank-pill">
          <span class="rank-icon"></span>
          <span>Just ranked up in style</span>
        </div>

        <section class="about-panel">
          <p class="label">About Me</p>
          <p class="bio">صفحة تعريف بسيطة بتصميم مستوحى من بروفايل ديسكورد، بألوان داكنة وتفاصيل ناعمة تعكس نفس شكل البروفايل بدون زر تعديل الملف الشخصي.</p>

          <div class="member-grid">
            <div class="member-item">
              <p class="label">Member Since</p>
              <p class="date">Apr 26, 2026</p>
            </div>
          </div>
        </section>
      </div>

      <nav class="bottom-bar" aria-label="Profile tabs">
        <div class="nav-item active">Profile</div>
        <div class="nav-item">Activity</div>
        <div class="nav-item">Info</div>
      </nav>
    </section>

    <p class="note">Discord-inspired personal profile page</p>
  </main>
</body>
</html>
